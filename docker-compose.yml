services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=file:/app/data/bot.db
    volumes:
      - bot-data:/app/data
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  bot-data:
