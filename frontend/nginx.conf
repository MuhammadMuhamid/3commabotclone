# Container nginx: serves the built SPA and proxies /api to the backend.
#
# The host nginx (deploy/nginx-production.conf) terminates TLS in front of this
# and sets the same headers. Both layers set them because this container is also
# reachable directly on the docker network, and a header that only exists one
# hop away is not a control.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx reports the tarball version in every response by default.
    server_tokens off;

    # ── Security headers on the HTML document ────────────────────────────────
    # These were absent here while deploy/nginx-production.conf had all five,
    # so a request that reached this container directly got none of them
    # (finding BOT-022). `always` so they survive an error response too.
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Without this the backend sees the proxy's address for every request
        # and collapses every client into a single rate-limit bucket, so one
        # noisy client locks everyone out (finding BOT-021). The correct line
        # already existed in deploy/nginx-production.conf.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhook payloads are ~200 bytes; the rest of the API needs a little more.
        location /api/webhooks/ {
            client_max_body_size 10k;
            proxy_pass http://backend:4000/api/webhooks/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    location /health {
        proxy_pass http://backend:4000/health;
        proxy_set_header Host $host;
    }

    # The service worker must not be cached across deploys, or a stale one keeps
    # serving and Web Push breaks silently.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
