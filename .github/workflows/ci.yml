# Safe CI: install, lint, typecheck, test and build only.
#
# Deliberately absent — and it must stay that way:
#   * no deployment and no AWS credentials
#   * no Binance call, mainnet or testnet
#   * no real webhook delivery
#   * no production database
# DRY_RUN is forced true for every job so no code path can reach an exchange.
name: CI

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: bot backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: bot frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no credential-shaped literals in tracked source
        run: bash scripts/ci/scan-secrets.sh
