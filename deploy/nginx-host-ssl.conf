# Install on host after certbot: /etc/nginx/sites-available/signalbot
# Certbot: sudo certbot certonly --nginx -d bot.alphawebstudioz.com

server {
    listen 80;
    server_name bot.alphawebstudioz.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name bot.alphawebstudioz.com;

    ssl_certificate /etc/letsencrypt/live/bot.alphawebstudioz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.alphawebstudioz.com/privkey.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # The frontend container publishes 8080 on the host. This used to say
    # 127.0.0.1:80 — the port this same server block listens on — so every
    # request proxied to itself (finding BOT-028).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
